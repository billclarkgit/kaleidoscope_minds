<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Thrill of Mr. K — Multitrack Player</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}body{margin:0;background:#111;color:#eee}main{max-width:980px;margin:auto;padding:22px}.back{display:inline-block;color:#bbb;text-decoration:none;margin-bottom:8px;font-size:14px}.back:hover{color:#fff}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #555;background:#242424;color:#fff;border-radius:7px;padding:8px 11px;font-weight:700}button.on{background:#8b1e2d}button.solo.on{background:#b58a00}.time{margin-left:auto;font-variant-numeric:tabular-nums}.seek{width:100%;margin:14px 0}.track{display:grid;grid-template-columns:minmax(100px,125px) 38px 38px minmax(210px,1fr) minmax(90px,120px) 42px;gap:5px;align-items:center;padding:7px 0;border-top:1px solid #333}.track label{overflow:hidden;text-overflow:ellipsis}.track button{padding:7px 6px}.wave{height:34px;border:1px solid #333;border-radius:5px;background:#191919;position:relative;overflow:hidden}.wave.active{background:#132630;border-color:#56c7ff;box-shadow:0 0 0 1px #56c7ff inset,0 0 10px rgba(86,199,255,.22)}.wave canvas{width:100%;height:100%;display:block}.head{z-index:2}.head{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0}.vol{width:100%}.pct{text-align:right;color:#aaa;font-size:13px}.status{min-height:1.4em;color:#d7c78d;margin:12px 0}@media(max-width:760px){main{padding:14px 10px}.track{grid-template-columns:minmax(92px,1fr) 40px 40px minmax(78px,1fr) 42px;gap:4px}.track label{white-space:normal;line-height:1.08}.wave{grid-column:1/6;grid-row:2}.vol{grid-column:4;grid-row:1;min-width:0}.pct{grid-column:5;grid-row:1;font-size:12px}.time{margin-left:0}}
</style></head><body><main><a class="back" href="../">← All Songs</a><h1>The Thrill of Mr. K</h1><div class="top"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="reset">Reset Mix</button><span class="time"><span id="now">0:00</span> / <span id="dur">2:24</span></span></div><input id="seek" class="seek" type="range" min="0" max="144.8" step=".01" value="0"><div id="status" class="status">Loading stems…</div><div id="tracks"></div></main><script>
(()=>{const files=["stems/0 Lead Vocals.mp3","stems/1 Backing Vocals.mp3","stems/2 Drums.mp3","stems/3 Bass.mp3","stems/4 Guitar.mp3","stems/5 Keyboard.mp3","stems/6 Synth.mp3","stems/7 Other.mp3","stems/8 Brass.mp3"],names=files.map(x=>x.split('/').pop().replace(/^\d+\s*/,'').replace(/\.mp3$/i,'')),duration=144.80002;let ctx,buffers=[],gains=[],sources=[],states=[],playing=false,pos=0,start=0,raf;const root=document.getElementById('tracks'),seek=document.getElementById('seek'),now=document.getElementById('now'),status=document.getElementById('status');function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}function ac(){return ctx||(ctx=new (AudioContext||webkitAudioContext)())}function apply(){let solo=states.some(s=>s.solo);states.forEach((s,i)=>{let on=!(s.mute||(solo&&!s.solo));if(gains[i])gains[i].gain.value=on?s.vol:0;s.m.classList.toggle('on',s.mute);s.b.classList.toggle('on',s.solo);let w=root.children[i]?.querySelector('.wave');if(w)w.classList.toggle('active',playing&&on)})}function stop(){sources.forEach(s=>{try{s.stop()}catch{}});sources=[]}function schedule(t){stop();pos=t;start=ac().currentTime+.04;sources=buffers.map((b,i)=>{let s=ac().createBufferSource();s.buffer=b;s.connect(gains[i]);s.start(start,Math.min(t,b.duration-.001));return s});playing=true;apply()}function cur(){return playing?Math.min(duration,pos+ac().currentTime-start):pos}function ui(t){seek.value=t;now.textContent=fmt(t);document.querySelectorAll('.head').forEach(h=>h.style.left=(100*t/duration)+'%')}function tick(){if(!playing)return;let t=cur();ui(t);if(t>=duration-.02){stop();playing=false;pos=duration;document.getElementById('play').textContent='▶ Play';apply();return}raf=requestAnimationFrame(tick)}
files.forEach((f,i)=>{let r=document.createElement('div');r.className='track';let l=document.createElement('label');l.textContent=names[i];let m=document.createElement('button');m.textContent='M';let b=document.createElement('button');b.textContent='S';b.className='solo';let w=document.createElement('div');w.className='wave';w.innerHTML='<canvas></canvas><div class="head"></div>';let v=document.createElement('input');v.type='range';v.min=0;v.max=1;v.step=.01;v.value=1;v.className='vol';let p=document.createElement('span');p.className='pct';p.textContent='100%';let st={mute:false,solo:false,vol:1,m,b};states.push(st);m.onclick=()=>{st.mute=!st.mute;apply()};b.onclick=()=>{st.solo=!st.solo;apply()};v.oninput=()=>{st.vol=+v.value;p.textContent=Math.round(st.vol*100)+'%';apply()};w.onclick=e=>{let q=w.getBoundingClientRect(),t=(e.clientX-q.left)/q.width*duration;if(playing){schedule(t);cancelAnimationFrame(raf);tick()}else pos=t;ui(t)};r.append(l,m,b,w,v,p);root.append(r)});
function drawWave(i,b){let cv=root.children[i].querySelector('canvas'),dpr=devicePixelRatio||1,w=Math.max(300,Math.round(cv.parentElement.getBoundingClientRect().width||600)),h=34;cv.style.width='100%';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);let x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);x.strokeStyle='#aaa';x.lineWidth=1;let channels=[];for(let n=0;n<b.numberOfChannels;n++)channels.push(b.getChannelData(n));let step=Math.max(1,Math.floor(b.length/w)),mid=h/2;x.beginPath();for(let px=0;px<w;px++){let peak=0,from=px*step,to=Math.min(b.length,from+step);for(let j=from;j<to;j+=Math.max(1,Math.floor(step/64))){for(let n=0;n<channels.length;n++)peak=Math.max(peak,Math.abs(channels[n][j]))}let y=Math.max(.7,peak*(h*.47));x.moveTo(px+.5,mid-y);x.lineTo(px+.5,mid+y)}x.stroke()}
async function load(){try{let c=ac();for(let i=0;i<files.length;i++){let r=await fetch(encodeURI(files[i]));if(!r.ok)throw Error(files[i]);let b=await c.decodeAudioData(await r.arrayBuffer());buffers.push(b);drawWave(i,b)}buffers.forEach(()=>{let g=c.createGain();g.connect(c.destination);gains.push(g)});apply();setTimeout(()=>buffers.forEach((b,i)=>drawWave(i,b)),50);status.textContent=''}catch(e){status.textContent='Could not load one or more MP3 stems.'}}load();
document.getElementById('play').onclick=async e=>{if(buffers.length!==files.length){status.textContent='Audio files still need to be uploaded to this song’s stems folder.';return}if(ac().state==='suspended')await ac().resume();if(playing){pos=cur();stop();playing=false;e.target.textContent='▶ Play';cancelAnimationFrame(raf);ui(pos);return}if(pos>=duration-.02)pos=0;schedule(pos);e.target.textContent='❚❚ Pause';tick()};document.getElementById('stop').onclick=()=>{stop();playing=false;pos=0;cancelAnimationFrame(raf);ui(0);document.getElementById('play').textContent='▶ Play'};seek.oninput=()=>{let t=+seek.value;if(playing){schedule(t);cancelAnimationFrame(raf);tick()}else pos=t;ui(t)};document.getElementById('reset').onclick=()=>{states.forEach((s,i)=>{s.mute=s.solo=false;s.vol=1;let r=root.children[i];r.querySelector('.vol').value=1;r.querySelector('.pct').textContent='100%'});apply()};
// Mobile visual-sync watchdog: derive the playhead from the master audio clock.
function resyncVisuals(){if(!playing)return;const t=cur();ui(t);}
setInterval(resyncVisuals,200);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){resyncVisuals();if(playing){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}}});
window.addEventListener('pageshow',()=>{resyncVisuals();if(playing){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});
})();
</script></body></html>
