function currentPos(){return playing?Math.min(duration,position+(ctx.currentTime-startClock)):position}
function stopSources(){sources.forEach(src=>{try{src.stop()}catch(e){}});sources=[]}
function scheduleFrom(t){const ac=ensureCtx();stopSources();position=Math.max(0,Math.min(duration,t));startClock=ac.currentTime;const when=ac.currentTime+0.035;sources=buffers.map((buf,i)=>{const src=ac.createBufferSource();src.buffer=buf;src.connect(gains[i]);if(position<buf.duration)src.start(when,position);return src});startClock=when;playing=true;apply()}
function setHeads(t){const pct=Math.max(0,Math.min(1,t/duration))*100;waveEls.forEach(w=>w.head.style.left=pct+'%')}
function updateUI(t){seek.value=t;now.textContent=fmt(t);setHeads(t)}
function tick(){if(!playing)return;const t=currentPos();updateUI(t);if(t>=duration-0.01){stopSources();playing=false;position=duration;apply();document.getElementById('play').textContent='▶ Play';return}raf=requestAnimationFrame(tick)}
async function loadAudio(){try{const ac=ensureCtx();status.textContent='Loading stems…';const decoded=[];for(const f of files){const r=await fetch(encodeURI(f));if(!r.ok)throw new Error('Could not load '+f);decoded.push(await ac.decodeAudioData(await r.arrayBuffer()));}decoded.forEach((b,i)=>buffers[i]=b);duration=Math.max(...buffers.map(b=>b.duration));seek.max=duration;durEl.textContent=fmt(duration);gains.length=0;buffers.forEach(()=>{const g=ac.createGain();g.connect(ac.destination);gains.push(g)});apply();status.textContent=''}catch(err){console.error(err);status.textContent='Cock Robin stems are not available yet. Upload all nine MP3 files to the cock-robin/stems folder, then reload this page.'}}
files.forEach((f,i)=>{const row=document.createElement('div');row.className='track';const lab=document.createElement('label');lab.textContent=names[i];const m=document.createElement('button');m.textContent='M';const s=document.createElement('button');s.textContent='S';s.className='solo';const ww=document.createElement('div');ww.className='wavewrap';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','wave-svg');svg.setAttribute('viewBox','0 0 1000 34');svg.setAttribute('preserveAspectRatio','none');svg.innerHTML='<line class="wave-mid" x1="0" y1="17" x2="1000" y2="17"/><polygon class="wave-shape" points="'+staticWaveforms[i]+'"/>';const head=document.createElement('div');head.className='playhead';ww.append(svg,head);const v=document.createElement('input');v.type='range';v.min=0;v.max=1;v.step=.01;v.value=1;v.className='vol';const p=document.createElement('span');p.className='pct';p.textContent='100%';const st={mute:false,solo:false,vol:1,mBtn:m,sBtn:s};states.push(st);waveEls.push({wrap:ww,head});m.addEventListener('click',()=>{st.mute=!st.mute;apply()});s.addEventListener('click',()=>{st.solo=!st.solo;apply()});v.addEventListener('input',()=>{st.vol=+v.value;p.textContent=Math.round(st.vol*100)+'%';apply()});ww.addEventListener('click',e=>{const r=ww.getBoundingClientRect();const t=((e.clientX-r.left)/r.width)*duration;seek.value=t;if(playing){scheduleFrom(t);cancelAnimationFrame(raf);tick()}else position=t;updateUI(t)});row.append(lab,m,s,ww,v,p);root.append(row)});
document.getElementById('play').addEventListener('click',async e=>{const playButton=e.currentTarget;if(!buffers.length){status.textContent='Stems are still loading…';return}const ac=ensureCtx();if(ac.state==='suspended')await ac.resume();if(playing){position=currentPos();stopSources();playing=false;apply();playButton.textContent='▶ Play';cancelAnimationFrame(raf);updateUI(position);return}if(position>=duration-0.01)position=0;scheduleFrom(position);apply();playButton.textContent='❚❚ Pause';cancelAnimationFrame(raf);tick()});
document.getElementById('stop').addEventListener('click',()=>{if(playing)stopSources();playing=false;position=0;apply();cancelAnimationFrame(raf);updateUI(0);document.getElementById('play').textContent='▶ Play'});
seek.addEventListener('input',()=>{const t=+seek.value;if(playing){scheduleFrom(t);cancelAnimationFrame(raf);tick()}else position=t;updateUI(t)});
document.getElementById('reset').addEventListener('click',()=>{states.forEach((s,i)=>{s.mute=s.solo=false;s.vol=1;const r=root.children[i];r.querySelector('.vol').value=1;r.querySelector('.pct').textContent='100%'});apply()});

// Mobile visual-sync watchdog: derive the playhead from the master audio clock.
function resyncVisuals(){if(!playing)return;const t=currentPos();updateUI(t);}
setInterval(resyncVisuals,200);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){resyncVisuals();if(playing){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}}});
window.addEventListener('pageshow',()=>{resyncVisuals();if(playing){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});
apply();loadAudio();})();
</script></body></html>
